name: erpsmart_app
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  animate_do: ^3.3.4
  another_flushbar: ^1.12.30
  flutter_screenutil: ^5.9.3

  cupertino_icons: ^1.0.8
  animated_text_kit: ^4.2.2
  flutter_native_splash: ^2.4.0
  lottie: ^3.1.0
  smooth_page_indicator: ^1.1.0
  fl_chart: ^1.1.1

  purchase_erp:
    path: ./purchase_erp
  crm:
    path: ./CRM
  hrm:
    path: ./hrm
  salees:
    path: ./salees

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true

  assets:
    - assets/lottie/
    - assets/
    - assets/images/
    - assets/icons/

flutter_native_splash:
  color: "#0A0F2E"
  fullscreen: true